<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧩 Pattern Master</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            overflow-x: hidden;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 15px;
            width: 100%;
        }
        
        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
            color: #a0a0a0;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 350px;
            margin-bottom: 20px;
            gap: 10px;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px 20px;
            text-align: center;
            flex: 1;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-label {
            font-size: 0.7rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            margin-top: 3px;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1;
            margin-bottom: 20px;
        }
        
        .tile {
            border-radius: 20px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s, filter 0.1s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        
        .tile:active {
            transform: scale(0.95);
        }
        
        .tile.green {
            background: linear-gradient(145deg, #00b894, #00a884);
            border: 3px solid #00d9a5;
        }
        
        .tile.red {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            border: 3px solid #ff6b6b;
        }
        
        .tile.yellow {
            background: linear-gradient(145deg, #f1c40f, #d4ac0d);
            border: 3px solid #ffe066;
        }
        
        .tile.blue {
            background: linear-gradient(145deg, #3498db, #2980b9);
            border: 3px solid #74b9ff;
        }
        
        .tile.lit {
            filter: brightness(1.5);
            transform: scale(1.05);
            box-shadow: 0 0 30px currentColor;
        }
        
        .tile.wrong {
            animation: shake 0.4s ease;
            background: linear-gradient(145deg, #636e72, #2d3436) !important;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        
        .center-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #2d3436, #1a1a2e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 3px solid rgba(255,255,255,0.1);
            z-index: 10;
        }
        
        .center-display.playing {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }
        
        .status-message {
            color: white;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 15px;
            min-height: 24px;
            opacity: 0.9;
        }
        
        .status-message.watching {
            color: #74b9ff;
        }
        
        .status-message.your-turn {
            color: #00d9a5;
        }
        
        .status-message.game-over {
            color: #ff6b6b;
        }
        
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        button {
            background: linear-gradient(145deg, #667eea, #764ba2);
            border: none;
            padding: 14px 35px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .high-score {
            color: #f1c40f;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .progress-bar {
            width: 100%;
            max-width: 320px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d9a5, #74b9ff);
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal-content {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-content h2 {
            color: white;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        .modal-content p {
            color: #a0a0a0;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .modal-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
        }
        
        .modal-stat {
            text-align: center;
        }
        
        .modal-stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00d9a5;
        }
        
        .modal-stat-label {
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-top: 5px;
        }
        
        .difficulty-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .difficulty-btn {
            padding: 10px 20px;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.1);
        }
        
        .difficulty-btn.active {
            background: linear-gradient(145deg, #667eea, #764ba2);
        }

        @media (max-width: 380px) {
            .game-board {
                max-width: 280px;
            }
            
            .center-display {
                width: 70px;
                height: 70px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧩 Pattern Master</h1>
        <div class="subtitle">Watch • Remember • Repeat</div>
    </div>
    
    <div class="stats-bar">
        <div class="stat-box">
            <div class="stat-label">Level</div>
            <div class="stat-value" id="level">1</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Best</div>
            <div class="stat-value" id="best">0</div>
        </div>
    </div>
    
    <div class="progress-bar">
        <div class="progress-fill" id="progress" style="width: 0%"></div>
    </div>
    
    <div class="status-message" id="status">Press Start to begin!</div>
    
    <div class="game-board" id="gameBoard">
        <div class="tile green" data-color="0"></div>
        <div class="tile red" data-color="1"></div>
        <div class="tile yellow" data-color="2"></div>
        <div class="tile blue" data-color="3"></div>
        <div class="center-display" id="centerDisplay">🎮</div>
    </div>
    
    <div class="controls">
        <button id="startBtn" onclick="startGame()">▶️ Start</button>
        <button id="strictBtn" onclick="toggleStrictMode()">🎲 Normal</button>
    </div>
    
    <div class="high-score" id="highScoreDisplay"></div>
    
    <div class="modal-overlay" id="gameOverModal">
        <div class="modal-content">
            <h2 id="modalTitle">Game Over!</h2>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalLevel">0</div>
                    <div class="modal-stat-label">Level</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalScore">0</div>
                    <div class="modal-stat-label">Score</div>
                </div>
            </div>
            <p id="modalMessage">Keep practicing to improve your memory!</p>
            <button onclick="closeModal(); startGame();">🔄 Play Again</button>
        </div>
    </div>
    
    <script>
        const tiles = document.querySelectorAll('.tile');
        const centerDisplay = document.getElementById('centerDisplay');
        const statusEl = document.getElementById('status');
        const levelEl = document.getElementById('level');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const progressEl = document.getElementById('progress');
        const startBtn = document.getElementById('startBtn');
        const strictBtn = document.getElementById('strictBtn');
        
        let pattern = [];
        let playerPattern = [];
        let level = 1;
        let score = 0;
        let isPlaying = false;
        let isPlayerTurn = false;
        let strictMode = false;
        
        const sounds = {
            0: new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE'),
            1: new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE'),
            2: new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE'),
            3: new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE')
        };
        
        // Use Web Audio API for better mobile support
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const frequencies = [329.63, 261.63, 440, 392]; // E4, C4, A4, G4
        
        function playTone(index) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequencies[index];
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }
        
        function playErrorSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 150;
            oscillator.type = 'sawtooth';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }
        
        function getHighScore() {
            return parseInt(localStorage.getItem('patternMasterBest') || '0');
        }
        
        function saveHighScore(newScore) {
            const current = getHighScore();
            if (newScore > current) {
                localStorage.setItem('patternMasterBest', newScore);
                return true;
            }
            return false;
        }
        
        function updateDisplay() {
            levelEl.textContent = level;
            scoreEl.textContent = score;
            bestEl.textContent = getHighScore();
            progressEl.style.width = ((playerPattern.length / pattern.length) * 100) + '%';
        }
        
        function toggleStrictMode() {
            strictMode = !strictMode;
            strictBtn.textContent = strictMode ? '🔴 Strict' : '🎲 Normal';
        }
        
        async function startGame() {
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            
            pattern = [];
            playerPattern = [];
            level = 1;
            score = 0;
            isPlaying = true;
            startBtn.disabled = true;
            updateDisplay();
            
            await new Promise(r => setTimeout(r, 500));
            nextRound();
        }
        
        function nextRound() {
            playerPattern = [];
            pattern.push(Math.floor(Math.random() * 4));
            updateDisplay();
            playPattern();
        }
        
        async function playPattern() {
            isPlayerTurn = false;
            statusEl.textContent = '👀 Watch the pattern...';
            statusEl.className = 'status-message watching';
            centerDisplay.textContent = '👁️';
            
            tiles.forEach(t => t.style.pointerEvents = 'none');
            
            await new Promise(r => setTimeout(r, 800));
            
            for (let i = 0; i < pattern.length; i++) {
                await flashTile(pattern[i]);
                await new Promise(r => setTimeout(r, 200));
            }
            
            isPlayerTurn = true;
            statusEl.textContent = '🎯 Your turn! Repeat the pattern';
            statusEl.className = 'status-message your-turn';
            centerDisplay.textContent = '🎯';
            tiles.forEach(t => t.style.pointerEvents = 'auto');
        }
        
        function flashTile(index) {
            return new Promise(resolve => {
                const tile = tiles[index];
                tile.classList.add('lit');
                playTone(index);
                
                setTimeout(() => {
                    tile.classList.remove('lit');
                    resolve();
                }, 400);
            });
        }
        
        async function handleTileClick(index) {
            if (!isPlayerTurn) return;
            
            await flashTile(index);
            playerPattern.push(index);
            updateDisplay();
            
            // Check if correct so far
            const currentIndex = playerPattern.length - 1;
            if (playerPattern[currentIndex] !== pattern[currentIndex]) {
                gameOver();
                return;
            }
            
            // Check if round complete
            if (playerPattern.length === pattern.length) {
                score += level * 100;
                level++;
                isPlayerTurn = false;
                tiles.forEach(t => t.style.pointerEvents = 'none');
                statusEl.textContent = '✅ Perfect! Next level...';
                centerDisplay.textContent = '✨';
                
                await new Promise(r => setTimeout(r, 1000));
                nextRound();
            }
        }
        
        function gameOver() {
            isPlaying = false;
            isPlayerTurn = false;
            playErrorSound();
            
            tiles.forEach(t => {
                t.style.pointerEvents = 'none';
                t.classList.add('wrong');
            });
            
            statusEl.textContent = '❌ Game Over!';
            statusEl.className = 'status-message game-over';
            centerDisplay.textContent = '💀';
            startBtn.disabled = false;
            
            const isNewHigh = saveHighScore(score);
            updateDisplay();
            
            setTimeout(() => {
                showGameOver(isNewHigh);
            }, 500);
        }
        
        function showGameOver(isNewHigh) {
            document.getElementById('finalLevel').textContent = level;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('modalTitle').textContent = isNewHigh ? '🎉 New Record!' : 'Game Over!';
            document.getElementById('modalMessage').textContent = isNewHigh 
                ? `Amazing! You beat your previous best of ${getHighScore() - score} points!` 
                : `You reached level ${level}. Keep practicing to beat ${getHighScore()}!`;
            document.getElementById('gameOverModal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('gameOverModal').classList.remove('show');
            tiles.forEach(t => t.classList.remove('wrong'));
        }
        
        // Event listeners
        tiles.forEach((tile, index) => {
            tile.addEventListener('click', () => handleTileClick(index));
            tile.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleTileClick(index);
            });
        });
        
        // Init
        updateDisplay();
        tiles.forEach(t => t.style.pointerEvents = 'none');
    </script>
</body>
</html>
