<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender - Betty's Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #000428, #004e92);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0ff;
            font-size: 14px;
            text-shadow: 0 0 10px #0ff;
            z-index: 10;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            display: none;
            z-index: 20;
        }
        #game-over h1 {
            font-size: 48px;
            color: #ff0;
            text-shadow: 0 0 20px #ff0;
            margin-bottom: 20px;
        }
        #game-over button {
            background: #0ff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            font-family: inherit;
            margin-top: 20px;
        }
        #game-over button:hover {
            background: #fff;
            box-shadow: 0 0 20px #0ff;
        }
        #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 20;
        }
        #start-screen h1 {
            font-size: 48px;
            color: #0ff;
            text-shadow: 0 0 20px #0ff;
            margin-bottom: 20px;
        }
        #start-screen p {
            color: #aaa;
            margin-bottom: 30px;
        }
        #start-screen button {
            background: #0ff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            font-family: inherit;
        }
        #start-screen button:hover {
            background: #fff;
            box-shadow: 0 0 20px #0ff;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game" width="800" height="600"></canvas>
        <div id="ui">
            <div>SCORE: <span id="score">0</span></div>
            <div>WAVE: <span id="wave">1</span></div>
            <div>LIVES: <span id="lives">3</span></div>
            <div>MULTIPLIER: x<span id="multiplier">1</span></div>
        </div>
        <div id="start-screen">
            <h1>🚀 SPACE DEFENDER</h1>
            <p>Built by Betty 🎮</p>
            <p>Arrow keys to move | Space to shoot</p>
            <button onclick="startGame()">START GAME</button>
        </div>
        <div id="game-over">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        let wave = 1;
        let lives = 3;
        let multiplier = 1;
        let multiplierTimer = 0;
        
        // Player
        const player = {
            x: 400,
            y: 500,
            width: 40,
            height: 40,
            speed: 5,
            color: '#0ff',
            powerups: {
                rapidFire: false,
                spreadShot: false,
                shield: false
            },
            powerupTimers: {
                rapidFire: 0,
                spreadShot: 0,
                shield: 0
            }
        };
        
        // Game objects
        let bullets = [];
        let enemies = [];
        let particles = [];
        let powerups = [];
        let stars = [];
        
        // Input
        const keys = {};
        
        // Initialize stars
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.1
            });
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' && gameRunning) {
                shoot();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            gameRunning = true;
            gameLoop();
            spawnEnemies();
        }
        
        function restartGame() {
            document.getElementById('game-over').style.display = 'none';
            score = 0;
            wave = 1;
            lives = 3;
            multiplier = 1;
            bullets = [];
            enemies = [];
            particles = [];
            powerups = [];
            player.x = 400;
            player.y = 500;
            player.powerups = { rapidFire: false, spreadShot: false, shield: false };
            gameRunning = true;
            gameLoop();
            spawnEnemies();
        }
        
        function shoot() {
            const rapidFire = player.powerups.rapidFire;
            const spreadShot = player.powerups.spreadShot;
            
            if (spreadShot) {
                bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -8, color: '#ff0' });
                bullets.push({ x: player.x - 10, y: player.y - 15, vx: -2, vy: -7, color: '#ff0' });
                bullets.push({ x: player.x + 10, y: player.y - 15, vx: 2, vy: -7, color: '#ff0' });
            } else {
                bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -8, color: '#0ff' });
            }
            
            if (rapidFire) {
                setTimeout(() => {
                    if (spreadShot) {
                        bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -8, color: '#ff0' });
                    } else {
                        bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -8, color: '#0ff' });
                    }
                }, 100);
            }
        }
        
        function spawnEnemies() {
            if (!gameRunning) return;
            
            const enemyCount = 3 + wave;
            for (let i = 0; i < enemyCount; i++) {
                setTimeout(() => {
                    if (!gameRunning) return;
                    
                    const type = Math.random();
                    let enemy = {
                        x: Math.random() * (canvas.width - 40) + 20,
                        y: -40,
                        width: 30,
                        height: 30,
                        speed: 1 + wave * 0.2,
                        hp: 1,
                        color: '#f00',
                        type: 'basic'
                    };
                    
                    if (type > 0.7) {
                        enemy.type = 'fast';
                        enemy.speed *= 2;
                        enemy.color = '#ff0';
                        enemy.width = 25;
                        enemy.height = 25;
                    } else if (type > 0.9) {
                        enemy.type = 'tank';
                        enemy.hp = 3;
                        enemy.speed *= 0.5;
                        enemy.color = '#f0f';
                        enemy.width = 40;
                        enemy.height = 40;
                    }
                    
                    enemies.push(enemy);
                }, i * 500);
            }
            
            // Boss every 5 waves
            if (wave % 5 === 0) {
                setTimeout(() => {
                    if (!gameRunning) return;
                    enemies.push({
                        x: canvas.width / 2,
                        y: -60,
                        width: 80,
                        height: 60,
                        speed: 0.5,
                        hp: 10,
                        color: '#f0f',
                        type: 'boss'
                    });
                }, enemyCount * 500 + 1000);
            }
            
            // Next wave
            setTimeout(() => {
                if (gameRunning && enemies.length === 0) {
                    wave++;
                    updateUI();
                    spawnEnemies();
                }
            }, 10000);
        }
        
        function spawnPowerup(x, y) {
            if (Math.random() > 0.9) {
                const types = ['rapidFire', 'spreadShot', 'shield'];
                const type = types[Math.floor(Math.random() * types.length)];
                powerups.push({
                    x: x,
                    y: y,
                    type: type,
                    color: type === 'rapidFire' ? '#ff0' : type === 'spreadShot' ? '#0f0' : '#00f'
                });
            }
        }
        
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 30,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }
        
        function update() {
            if (!gameRunning) return;
            
            // Player movement
            if (keys['ArrowLeft'] && player.x > 20) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < canvas.width - 20) player.x += player.speed;
            if (keys['ArrowUp'] && player.y > 20) player.y -= player.speed;
            if (keys['ArrowDown'] && player.y < canvas.height - 20) player.y += player.speed;
            
            // Update powerup timers
            Object.keys(player.powerupTimers).forEach(key => {
                if (player.powerupTimers[key] > 0) {
                    player.powerupTimers[key]--;
                    if (player.powerupTimers[key] <= 0) {
                        player.powerups[key] = false;
                    }
                }
            });
            
            // Update multiplier
            if (multiplierTimer > 0) {
                multiplierTimer--;
                if (multiplierTimer <= 0) {
                    multiplier = 1;
                }
            }
            
            // Update bullets
            bullets = bullets.filter(bullet => {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                return bullet.y > -10 && bullet.y < canvas.height + 10;
            });
            
            // Update enemies
            enemies.forEach(enemy => {
                enemy.y += enemy.speed;
                
                if (enemy.type === 'boss') {
                    enemy.x += Math.sin(Date.now() / 1000) * 2;
                }
            });
            
            // Check collisions
            bullets.forEach((bullet, bi) => {
                enemies.forEach((enemy, ei) => {
                    if (Math.abs(bullet.x - enemy.x) < enemy.width/2 + 5 &&
                        Math.abs(bullet.y - enemy.y) < enemy.height/2 + 5) {
                        enemy.hp--;
                        bullets.splice(bi, 1);
                        
                        if (enemy.hp <= 0) {
                            createExplosion(enemy.x, enemy.y, enemy.color);
                            score += 100 * multiplier;
                            multiplier = Math.min(multiplier + 0.1, 5);
                            multiplierTimer = 300;
                            spawnPowerup(enemy.x, enemy.y);
                            enemies.splice(ei, 1);
                        }
                    }
                });
            });
            
            // Check enemy-player collisions
            enemies.forEach((enemy, ei) => {
                if (Math.abs(enemy.x - player.x) < (enemy.width + player.width) / 2 &&
                    Math.abs(enemy.y - player.y) < (enemy.height + player.height) / 2) {
                    
                    if (player.powerups.shield) {
                        player.powerups.shield = false;
                        player.powerupTimers.shield = 0;
                        createExplosion(enemy.x, enemy.y, '#0ff');
                        enemies.splice(ei, 1);
                    } else {
                        lives--;
                        createExplosion(player.x, player.y, '#0ff');
                        enemies.splice(ei, 1);
                        
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                }
                
                // Remove enemies that go off screen
                if (enemy.y > canvas.height + 50) {
                    enemies.splice(ei, 1);
                }
            });
            
            // Check powerup collection
            powerups.forEach((powerup, pi) => {
                powerup.y += 2;
                if (Math.abs(powerup.x - player.x) < 30 &&
                    Math.abs(powerup.y - player.y) < 30) {
                    player.powerups[powerup.type] = true;
                    player.powerupTimers[powerup.type] = 600;
                    powerups.splice(pi, 1);
                }
                if (powerup.y > canvas.height) {
                    powerups.splice(pi, 1);
                }
            });
            
            // Update particles
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.vx *= 0.95;
                p.vy *= 0.95;
                return p.life > 0;
            });
            
            // Update stars
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
            
            updateUI();
        }
        
        function draw() {
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 4, 40, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Draw player
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // Shield effect
            if (player.powerups.shield) {
                ctx.strokeStyle = '#00f';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 30, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // Player ship
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(-15, 20);
            ctx.lineTo(0, 10);
            ctx.lineTo(15, 20);
            ctx.closePath();
            ctx.fill();
            
            // Engine glow
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.moveTo(-5, 20);
            ctx.lineTo(0, 30 + Math.random() * 10);
            ctx.lineTo(5, 20);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
            
            // Draw bullets
            bullets.forEach(bullet => {
                ctx.fillStyle = bullet.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = bullet.color;
                ctx.fillRect(bullet.x - 3, bullet.y - 8, 6, 16);
                ctx.shadowBlur = 0;
            });
            
            // Draw enemies
            enemies.forEach(enemy => {
                ctx.save();
                ctx.translate(enemy.x, enemy.y);
                ctx.fillStyle = enemy.color;
                
                if (enemy.type === 'boss') {
                    // Boss shape
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.lineTo(-40, 30);
                    ctx.lineTo(0, 20);
                    ctx.lineTo(40, 30);
                    ctx.closePath();
                    ctx.fill();
                    
                    // Boss health bar
                    ctx.fillStyle = '#f00';
                    ctx.fillRect(-35, -40, 70 * (enemy.hp / 10), 5);
                } else {
                    // Regular enemy
                    ctx.beginPath();
                    ctx.moveTo(0, enemy.height/2);
                    ctx.lineTo(-enemy.width/2, -enemy.height/2);
                    ctx.lineTo(enemy.width/2, -enemy.height/2);
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
            });
            
            // Draw powerups
            powerups.forEach(powerup => {
                ctx.save();
                ctx.translate(powerup.x, powerup.y);
                ctx.fillStyle = powerup.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = powerup.color;
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(powerup.type === 'rapidFire' ? 'R' : powerup.type === 'spreadShot' ? 'S' : 'SH', 0, 4);
                ctx.shadowBlur = 0;
                ctx.restore();
            });
            
            // Draw particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }
        
        function updateUI() {
            document.getElementById('score').textContent = Math.floor(score);
            document.getElementById('wave').textContent = wave;
            document.getElementById('lives').textContent = lives;
            document.getElementById('multiplier').textContent = multiplier.toFixed(1);
        }
        
        function gameOver() {
            gameRunning = false;
            document.getElementById('final-score').textContent = Math.floor(score);
            document.getElementById('game-over').style.display = 'block';
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
