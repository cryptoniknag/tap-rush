<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Avatar World - Tap Rush</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .loader {
            text-align: center;
        }
        .tree-loader {
            width: 60px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }
        .trunk {
            width: 20px;
            height: 40px;
            background: #8B4513;
            margin: 0 auto;
            border-radius: 3px;
        }
        .leaves {
            width: 50px;
            height: 40px;
            background: #228B22;
            border-radius: 50%;
            margin: 0 auto -20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loader">
            <div class="tree-loader">
                <div class="leaves"></div>
                <div class="trunk"></div>
            </div>
            <p>Loading Agent World...</p>
        </div>
    </div>

    <!-- START BUTTON - Enabled only when ready -->
    <button id="start-btn" disabled style="position:fixed;top:10px;right:10px;z-index:99999;padding:20px 30px;font-size:20px;font-weight:bold;background:#666;color:#999;border:4px solid #fff;border-radius:10px;cursor:not-allowed;box-shadow:0 4px 8px rgba(0,0,0,0.5);text-transform:uppercase;letter-spacing:2px;transition:all 0.3s;">⏳ LOADING...</button>

    <div id="canvas-container"></div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r133/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.133.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Main application - MUST LOAD FIRST -->
    <script src="https://cryptoniknag.github.io/tap-rush/3d-avatars/js/avatar-world.js?v=41" onload="console.log('✅ avatar-world.js loaded successfully')" onerror="console.error('❌ avatar-world.js FAILED to load')">
    </script>
    
    <!-- Daily Routine System - loads AFTER avatar-world.js -->
    <script src="https://cryptoniknag.github.io/tap-rush/3d-avatars/js/daily-routine.js?v=5" onload="console.log('✅ daily-routine.js loaded successfully')" onerror="console.error('❌ daily-routine.js FAILED to load')">
    </script>
    
    <!-- EMERGENCY DEBUG + LOAD CHECK -->
    <script>
        // IMMEDIATE DEBUG - Log before anything loads
        console.log('🔥 INDEX.HTML INLINE SCRIPT: Starting...');
        console.log('🔥 THREE:', typeof THREE); // Should be 'undefined' at this point
        
        // GLOBAL LOAD CHECK
        window.addEventListener('load', function() {
            console.log('🔥 WINDOW LOAD EVENT FIRED');
            
            // Emergency debug output
            setTimeout(function() {
                console.log('🔥 === LOAD CHECK ===');
                console.log('🔥 THREE:', typeof THREE);
                console.log('🔥 window.init:', typeof window.init);
                console.log('🔥 initDailyRoutine:', typeof initDailyRoutine);
                console.log('🔥 startFullRoutine:', typeof startFullRoutine);
                console.log('🔥 window.agents:', typeof window.agents);
                console.log('🔥 agents:', typeof agents);
                
                if (typeof startFullRoutine !== 'function') {
                    console.error('🔥 CRITICAL: startFullRoutine not loaded!');
                }
                if (!window.agents) {
                    console.error('🔥 CRITICAL: window.agents not created!');
                }
            }, 2000);
            
            // Check if ready and enable button
            checkReady();
        });
        
        // Check if functions are actually ready
        function checkReady() {
            const btn = document.getElementById('start-btn');
            if (!btn) return;
            
            // Check ACTUAL readiness: 4 agents loaded AND startFullRoutine exists
            const hasAgents = window.agents && Object.keys(window.agents).length === 4;
            const hasRoutine = typeof startFullRoutine === 'function';
            
            // DEBUG: Log current state
            console.log('CHECKING:', {
                hasAgents: hasAgents,
                agentCount: window.agents ? Object.keys(window.agents).length : 0,
                hasRoutine: hasRoutine
            });
            
            if (hasAgents && hasRoutine) {
                // Actually ready - enable button
                btn.disabled = false;
                btn.innerHTML = '▶️ START ROUTINE';
                btn.style.background = '#00ff00';
                btn.style.color = '#000';
                btn.style.cursor = 'pointer';
                btn.style.boxShadow = '0 0 20px rgba(0,255,0,0.8), 0 4px 8px rgba(0,0,0,0.5)';
                btn.onclick = startFullRoutine;
                console.log('✅ Button enabled - routine ready');
            } else {
                // Not ready yet - keep button disabled and check again
                btn.disabled = true;
                btn.innerHTML = '⏳ LOADING...';
                console.log('⏳ Waiting for agents and routine...');
                setTimeout(checkReady, 500);
            }
        }
        
        // Global error handler
        window.addEventListener('error', function(e) {
            console.error('💥 GLOBAL ERROR:', e.message, 'at', e.filename, 'line', e.lineno);
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen && loadingScreen.style.display !== 'none') {
                loadingScreen.innerHTML = 
                    '<div style="color:red;padding:20px;"><h3>JavaScript Error</h3><p>' + 
                    e.message + '</p><p>File: ' + (e.filename || 'unknown') + '</p></div>';
            }
        });
    </script>
</body>
</html>
