<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Avatar World - Tap Rush</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .loader {
            text-align: center;
        }
        .tree-loader {
            width: 60px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }
        .trunk {
            width: 20px;
            height: 40px;
            background: #8B4513;
            margin: 0 auto;
            border-radius: 3px;
        }
        .leaves {
            width: 50px;
            height: 40px;
            background: #228B22;
            border-radius: 50%;
            margin: 0 auto -20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loader">
            <div class="tree-loader">
                <div class="leaves"></div>
                <div class="trunk"></div>
            </div>
            <p>Loading Agent World...</p>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r133/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.133.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Main application -->
    <script src="js/avatar-world.js?v=36" onload="console.log('avatar-world.js loaded successfully')" onerror="console.error('avatar-world.js FAILED to load')">
    </script>
    
    <script>
        console.log('HTML loaded, checking...');
        
        // Wait for everything to load
        window.addEventListener('load', function() {
            console.log('Window loaded');
            
            setTimeout(function() {
                console.log('Checking THREE...', typeof THREE);
                console.log('Checking init...', typeof init);
                
                if (typeof THREE === 'undefined') {
                    document.getElementById('loading-screen').innerHTML = 
                        '<div style="color:red;padding:20px;"><h3>Three.js failed to load</h3></div>';
                } else if (typeof init === 'undefined') {
                    document.getElementById('loading-screen').innerHTML = 
                        '<div style="color:red;padding:20px;"><h3>init() not found</h3><p>Check console</p></div>';
                } else {
                    console.log('Calling init()...');
                    try {
                        init();
                        console.log('init() called!');
                    } catch (e) {
                        console.error('init() error:', e);
                        document.getElementById('loading-screen').innerHTML = 
                            '<div style="color:red;padding:20px;"><h3>Error</h3><p>' + e.message + '</p></div>';
                    }
                }
            }, 1000);
        });
    </script>
</body>
</html>
