<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Avatar World - Tap Rush</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .loader {
            text-align: center;
        }
        .tree-loader {
            width: 60px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }
        .trunk {
            width: 20px;
            height: 40px;
            background: #8B4513;
            margin: 0 auto;
            border-radius: 3px;
        }
        .leaves {
            width: 50px;
            height: 40px;
            background: #228B22;
            border-radius: 50%;
            margin: 0 auto -20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loader">
            <div class="tree-loader">
                <div class="leaves"></div>
                <div class="trunk"></div>
            </div>
            <p>Loading Agent World...</p>
        </div>
    </div>

    <!-- SIMPLE START BUTTON -->
    <button id="start-btn" onclick="if(typeof startRoutine==='function')startRoutine();else alert('Please wait, loading...')" 
        style="position:fixed;top:20px;right:20px;z-index:10000;padding:15px 30px;font-size:18px;background:#00ff00;color:#000;font-weight:bold;border:none;border-radius:8px;cursor:pointer;">▶️ START ROUTINE</button>

    <div id="canvas-container"></div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r133/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.133.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Main application -->
    <script src="https://cryptoniknag.github.io/tap-rush/3d-avatars/js/avatar-world.js"></script>
    
    <!-- Daily Routine System -->
    <script src="https://cryptoniknag.github.io/tap-rush/3d-avatars/js/daily-routine.js"></script>
    
    <!-- Chat System -->
    <script src="https://cryptoniknag.github.io/tap-rush/3d-avatars/js/chat-system.js"></script>
    
    <script>
        // Hide loading screen when ready
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) loadingScreen.style.display = 'none';
            }, 1000);
        });
    </script>
</body>
</html>
