<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Avatar World - Tap Rush</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
        }
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .loader {
            text-align: center;
        }
        .tree-loader {
            width: 60px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }
        .trunk {
            width: 20px;
            height: 40px;
            background: #8B4513;
            margin: 0 auto;
            border-radius: 3px;
        }
        .leaves {
            width: 50px;
            height: 40px;
            background: #228B22;
            border-radius: 50%;
            margin: 0 auto -20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* Main Layout - 3D Canvas takes 65%, Chat takes 35% */
        #main-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        
        #canvas-container {
            width: 65%;
            height: 100vh;
            position: relative;
        }
        
        /* Agent Selection Hint Overlay */
        #agent-hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(25, 118, 210, 0.9), rgba(13, 71, 161, 0.9));
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: hintPulse 2s infinite;
        }
        
        #agent-hint.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        @keyframes hintPulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(25, 118, 210, 0.5); }
            50% { box-shadow: 0 4px 25px rgba(25, 118, 210, 0.8), 0 0 30px rgba(25, 118, 210, 0.4); }
        }
        
        /* Full-Size Chat Interface - Telegram Style */
        #chat-panel {
            width: 35%;
            height: 100vh;
            background: #17212b;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #242f3d;
        }
        
        /* Chat Header */
        #chat-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #242f3d;
            border-bottom: 1px solid #1a232d;
            min-height: 60px;
        }
        
        #chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        #chat-avatar.groot { background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%); }
        #chat-avatar.fin { background: linear-gradient(135deg, #1976D2 0%, #0D47A1 100%); }
        #chat-avatar.betty { background: linear-gradient(135deg, #EC407A 0%, #C2185B 100%); }
        #chat-avatar.smith { background: linear-gradient(135deg, #455A64 0%, #263238 100%); }
        
        #chat-header-info {
            flex: 1;
            min-width: 0;
        }
        
        #chat-agent-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }
        
        #chat-agent-status {
            font-size: 13px;
            color: #8a9aae;
        }
        
        #chat-agent-status.online { color: #4CAF50; }
        #chat-agent-status.typing { color: #64B5F6; font-style: italic; }
        
        #chat-close-btn {
            background: none;
            border: none;
            color: #8a9aae;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        #chat-close-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        /* Welcome State */
        #chat-welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            color: #8a9aae;
        }
        
        #chat-welcome-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        #chat-welcome h3 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 10px;
        }
        
        #chat-welcome p {
            font-size: 14px;
            line-height: 1.5;
        }
        
        #chat-welcome .agents-list {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .welcome-agent {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .welcome-agent:hover {
            transform: scale(1.1);
        }
        
        /* Messages Area */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .chat-date-divider {
            text-align: center;
            color: #6b7c8e;
            font-size: 12px;
            margin: 16px 0;
            position: relative;
        }
        
        .chat-date-divider::before,
        .chat-date-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: #242f3d;
        }
        
        .chat-date-divider::before { left: 0; }
        .chat-date-divider::after { right: 0; }
        
        /* Telegram-style Message Bubbles */
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            animation: messageAppear 0.2s ease;
        }
        
        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            align-self: flex-end;
            background: #2b5278;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        
        .message.agent {
            align-self: flex-start;
            background: #182533;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        
        .message.task-complete {
            background: #1e3a2f;
            border-left: 3px solid #4CAF50;
        }
        
        .message-time {
            font-size: 11px;
            color: #6b7c8e;
            margin-top: 4px;
            text-align: right;
        }
        
        .message.user .message-time {
            color: #8aa8c5;
        }
        
        /* Typing Indicator */
        .typing-indicator {
            align-self: flex-start;
            background: #182533;
            padding: 12px 16px;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #64B5F6;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        /* Task Log */
        .task-log {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 8px;
            font-size: 12px;
        }
        
        .task-log-header {
            color: #4CAF50;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* Input Area */
        #chat-input-area {
            padding: 12px 16px;
            background: #242f3d;
            border-top: 1px solid #1a232d;
        }
        
        #quick-commands {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        
        .quick-cmd {
            padding: 6px 12px;
            background: #2b3a4a;
            border: 1px solid #3d4f61;
            border-radius: 16px;
            color: #8a9aae;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .quick-cmd:hover {
            background: #3d4f61;
            color: #fff;
        }
        
        .quick-cmd.active {
            background: #2b5278;
            border-color: #4a90d9;
            color: #fff;
        }
        
        #chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        #chat-input {
            flex: 1;
            background: #17212b;
            border: 1px solid #242f3d;
            border-radius: 20px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            font-family: inherit;
        }
        
        #chat-input:focus {
            outline: none;
            border-color: #4a90d9;
        }
        
        #chat-input::placeholder {
            color: #6b7c8e;
        }
        
        #chat-send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #2b5278;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        #chat-send-btn:hover {
            background: #4a90d9;
        }
        
        #chat-send-btn:disabled {
            background: #3d4f61;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        /* Agent Stats/Task Panel */
        #agent-stats {
            background: #1a232d;
            border-top: 1px solid #242f3d;
            padding: 12px 16px;
            font-size: 12px;
        }
        
        #agent-stats-title {
            color: #6b7c8e;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #242f3d;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: #8a9aae;
        }
        
        .stat-value {
            color: #4CAF50;
            font-weight: 500;
        }
        
        /* Task History */
        #task-history {
            max-height: 100px;
            overflow-y: auto;
        }
        
        .history-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            color: #6b7c8e;
        }
        
        .history-item.completed::before {
            content: '✓';
            color: #4CAF50;
        }
        
        /* Speech Bubbles in 3D */
        .speech-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 500;
            max-width: 200px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            pointer-events: none;
            z-index: 9999;
            animation: bubblePop 0.3s ease;
        }
        
        @keyframes bubblePop {
            0% { transform: scale(0) translateY(10px); opacity: 0; }
            80% { transform: scale(1.1) translateY(-5px); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.95) transparent transparent;
        }
        
        .speech-bubble.groot { background: #E8F5E9; border: 2px solid #4CAF50; }
        .speech-bubble.groot::after { border-color: #E8F5E9 transparent transparent; }
        
        .speech-bubble.fin { background: #E3F2FD; border: 2px solid #1976D2; }
        .speech-bubble.fin::after { border-color: #E3F2FD transparent transparent; }
        
        .speech-bubble.betty { background: #FCE4EC; border: 2px solid #EC407A; }
        .speech-bubble.betty::after { border-color: #FCE4EC transparent transparent; }
        
        .speech-bubble.smith { background: #ECEFF1; border: 2px solid #455A64; }
        .speech-bubble.smith::after { border-color: #ECEFF1 transparent transparent; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loader">
            <div class="tree-loader">
                <div class="leaves"></div>
                <div class="trunk"></div>
            </div>
            <p>Loading Agent World...</p>
        </div>
    </div>

    <div id="main-container">
        <!-- 3D Canvas Area -->
        <div id="canvas-container">
            <div id="agent-hint">👆 Click an agent to start chatting</div>
        </div>
        
        <!-- Chat Panel -->
        <div id="chat-panel">
            <!-- Chat Header -->
            <div id="chat-header">
                <div id="chat-avatar">🤖</div>
                <div id="chat-header-info">
                    <div id="chat-agent-name">Select an Agent</div>
                    <div id="chat-agent-status">Click on any agent in the 3D office</div>
                </div>
                <button id="chat-close-btn" onclick="closeChat()">×</button>
            </div>
            
            <!-- Welcome State (shown when no agent selected) -->
            <div id="chat-welcome">
                <div id="chat-welcome-icon">💬</div>
                <h3>Agent Command Center</h3>
                <p>Click on any agent in the 3D office to give them tasks and instructions.</p>
                <div class="agents-list">
                    <div class="welcome-agent groot" style="background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);" onclick="selectAgentById('groot')">🌳</div>
                    <div class="welcome-agent fin" style="background: linear-gradient(135deg, #1976D2 0%, #0D47A1 100%);" onclick="selectAgentById('fin')">📊</div>
                    <div class="welcome-agent betty" style="background: linear-gradient(135deg, #EC407A 0%, #C2185B 100%);" onclick="selectAgentById('betty')">🎨</div>
                    <div class="welcome-agent smith" style="background: linear-gradient(135deg, #455A64 0%, #263238 100%);" onclick="selectAgentById('smith')">💻</div>
                </div>
            </div>
            
            <!-- Messages Area -->
            <div id="chat-messages" style="display: none;"></div>
            
            <!-- Input Area -->
            <div id="chat-input-area" style="display: none;">
                <div id="quick-commands">
                    <button class="quick-cmd" onclick="sendQuickCommand('desk')">🏢 Go to Desk</button>
                    <button class="quick-cmd" onclick="sendQuickCommand('kanban')">📋 Kanban</button>
                    <button class="quick-cmd" onclick="sendQuickCommand('meeting')">📅 Meeting</button>
                    <button class="quick-cmd" onclick="sendQuickCommand('coffee')">☕ Coffee</button>
                    <button class="quick-cmd" onclick="sendQuickCommand('gym')">💪 Gym</button>
                    <button class="quick-cmd" onclick="sendQuickCommand('wave')">👋 Wave</button>
                </div>
                <div id="chat-input-wrapper">
                    <textarea id="chat-input" placeholder="Type a command or message..." rows="1" onkeypress="handleChatKeyPress(event)"></textarea>
                    <button id="chat-send-btn" onclick="sendChatMessage()">➤</button>
                </div>
            </div>
            
            <!-- Agent Stats -->
            <div id="agent-stats" style="display: none;">
                <div id="agent-stats-title">Task History</div>
                <div id="task-history"></div>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r133/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.133.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Main application - Local files -->
    <script src="js/avatar-world.js"></script>
    
    <!-- Daily Routine System -->
    <script src="js/daily-routine.js"></script>
    
    <!-- Chat System -->
    <script src="js/chat-system.js"></script>
    
    <script>
        // Hide loading screen when ready
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) loadingScreen.style.display = 'none';
                
                // Show agent hint
                const hint = document.getElementById('agent-hint');
                if (hint) {
                    hint.classList.add('visible');
                    setTimeout(() => hint.classList.remove('visible'), 5000);
                }
            }, 1000);
        });
        
        // Global function to select agent by ID (for welcome screen)
        function selectAgentById(agentId) {
            if (typeof openChat === 'function') {
                openChat(agentId);
            }
        }
    </script>
</body>
</html>
