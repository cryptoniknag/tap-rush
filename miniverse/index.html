<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miniverse Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    h1 {
      font-size: 20px;
      color: #e94560;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    #miniverse-container {
      border: 2px solid #333;
      border-radius: 4px;
      overflow: hidden;
      background: #0f0f23;
      display: inline-block;
      line-height: 0;
      transition: border-color 0.15s, border-radius 0.15s;
    }
    #editor-wrapper #miniverse-container {
      border-color: #00ff88;
      border-radius: 4px 0 0 4px;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #16213e;
      border: 1px solid #e94560;
      color: #e94560;
      padding: 6px 14px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      border-radius: 2px;
      transition: all 0.15s;
    }
    button:hover {
      background: #e94560;
      color: #1a1a2e;
    }
    select {
      background: #16213e;
      border: 1px solid #e94560;
      color: #e94560;
      padding: 6px 14px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      border-radius: 2px;
    }
    select option { background: #16213e; color: #eee; }
    #tooltip {
      position: fixed;
      background: rgba(0,0,0,0.85);
      border: 1px solid #e94560;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 11px;
      pointer-events: none;
      display: none;
      z-index: 100;
      max-width: 200px;
    }
    #tooltip .name { color: #e94560; font-weight: bold; }
    #tooltip .state { color: #aaa; }
    #tooltip .task { color: #66aaff; }
    .status-bar {
      display: flex;
      gap: 16px;
      font-size: 11px;
      color: #555;
    }
    .status-bar .agent {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
    }
    .status-dot.working { background: #4ade80; }
    .status-dot.idle { background: #fbbf24; }
    .status-dot.sleeping { background: #818cf8; }
    .status-dot.thinking { background: #f472b6; }
    .status-dot.error { background: #ef4444; }
    .status-dot.speaking { background: #22d3ee; }
  </style>
  <script>
    console.log('IMMEDIATE: HTML parsing started');
    
    // Store errors for debugging
    window._miniverseErrors = [];
    
    // Capture all errors
    window.addEventListener('error', function(e) {
      window._miniverseErrors.push({
        type: 'error',
        message: e.message,
        filename: e.filename,
        lineno: e.lineno,
        colno: e.colno,
        error: e.error ? e.error.stack : null
      });
      console.log('Captured error:', e.message);
    });
    
    window.addEventListener('unhandledrejection', function(e) {
      window._miniverseErrors.push({
        type: 'unhandledrejection',
        reason: e.reason ? (e.reason.stack || e.reason.toString()) : 'Unknown'
      });
      console.log('Captured rejection:', e.reason);
    });
    
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOMContentLoaded fired');
      const statusDiv = document.getElementById('loading-status');
      if (statusDiv) {
        statusDiv.innerHTML += '<br><span style="color:yellow;">DOM ready, loading module...</span>';
      }
    });
  </script>
  <!-- Load the Miniverse as a regular script (not module) since it's an IIFE bundle -->
  <script src="./assets/index--9ugS9WN.js"></script>
  <script>
    // Status updater
    const statusDiv = document.getElementById('loading-status');
    function updateStatus(msg, type = 'info') {
      console.log('[STATUS]', msg);
      if (statusDiv) {
        const color = type === 'error' ? '#ff4444' : type === 'success' ? '#00ff88' : '#ffff00';
        statusDiv.innerHTML += '<div style="color:' + color + ';font-size:11px;margin:2px 0;">' + msg + '</div>';
      }
    }
    
    // Check if script loaded
    setTimeout(function() {
      updateStatus('Script loaded, checking canvas...');
      const canvas = document.querySelector('canvas');
      if (canvas && canvas.id !== 'fallback-canvas') {
        updateStatus('Canvas created!', 'success');
        setTimeout(function() { if (statusDiv) statusDiv.style.display = 'none'; }, 1000);
      } else {
        updateStatus('No canvas - check console for errors', 'error');
      }
    }, 2000);
  </script>
  <script>
    console.log('=== INLINE SCRIPT START ===');
    
    // Global error handler
    window.onerror = function(msg, url, line, col, error) {
      console.error('=== GLOBAL ERROR ===');
      console.error('Message:', msg);
      console.error('URL:', url);
      console.error('Line:', line, 'Column:', col);
      console.error('Error:', error);
      const errorDiv = document.createElement('div');
      errorDiv.style.cssText = 'color:red;padding:20px;background:#1a0000;border:2px solid red;margin:20px;max-width:800px;overflow:auto;';
      errorDiv.innerHTML = '<h3>JavaScript Error</h3><pre>' + msg + '\nAt: ' + url + ':' + line + '\n\n' + (error && error.stack ? error.stack : 'No stack trace') + '</pre>';
      document.body.appendChild(errorDiv);
      return true;
    };
    
    // Unhandled promise rejection handler
    window.addEventListener('unhandledrejection', function(event) {
      console.error('=== UNHANDLED PROMISE REJECTION ===');
      console.error('Reason:', event.reason);
      const errorDiv = document.createElement('div');
      errorDiv.style.cssText = 'color:orange;padding:20px;background:#2a1a00;border:2px solid orange;margin:20px;';
      errorDiv.innerHTML = '<h3>Unhandled Promise Rejection</h3><pre>' + (event.reason && event.reason.stack ? event.reason.stack : String(event.reason)) + '</pre>';
      document.body.appendChild(errorDiv);
    });
    
    // Debug: Check for canvas periodically
    let checkCount = 0;
    const checkInterval = setInterval(function() {
      checkCount++;
      const canvas = document.querySelector('canvas');
      const container = document.getElementById('miniverse-container');
      console.log('Check #' + checkCount + ': canvas=' + (canvas ? 'YES' : 'NO') + ', container=' + (container ? 'YES' : 'NO'));
      
      if (canvas) {
        console.log('Canvas found! Stopping checks.');
        clearInterval(checkInterval);
      } else if (checkCount >= 20) {
        console.error('No canvas after 20 checks (10 seconds)');
        clearInterval(checkInterval);
        const debugDiv = document.createElement('div');
        debugDiv.style.cssText = 'color:orange;padding:20px;background:#2a1a00;border:2px solid orange;margin:20px;';
        debugDiv.innerHTML = '<h3>Debug: No canvas created after 10 seconds</h3><p>The module may have failed to load or execute. Check the console for errors.</p>';
        document.body.appendChild(debugDiv);
      }
    }, 500);
    
    console.log('=== INLINE SCRIPT END ===');
  </script>
</head>
<body>
  <h1>Miniverse</h1>
  <p class="subtitle">a tiny pixel world for your AI agents</p>
  <div id="miniverse-container">
    <div id="loading-status" style="color:#00ff88;padding:20px;text-align:center;font-family:monospace;">
      Loading Miniverse...
    </div>
    <canvas id="fallback-canvas" width="512" height="384" style="background:#0f0f23; display:none;"></canvas>
  </div>
  <div class="controls">
    <select id="world-select"></select>
    <button onclick="triggerIntercom()">Intercom</button>
    <button onclick="cycleState('morty')">Cycle Morty</button>
    <button onclick="cycleState('dexter')">Cycle Dexter</button>
  </div>
  <div class="status-bar" id="status-bar"></div>
  <div id="tooltip">
    <div class="name"></div>
    <div class="state"></div>
    <div class="task"></div>
  </div>
</body>
</html>
