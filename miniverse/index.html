<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miniverse Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    h1 {
      font-size: 20px;
      color: #e94560;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    #miniverse-container {
      border: 2px solid #333;
      border-radius: 4px;
      overflow: hidden;
      background: #0f0f23;
      display: inline-block;
      line-height: 0;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #16213e;
      border: 1px solid #e94560;
      color: #e94560;
      padding: 6px 14px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      border-radius: 2px;
      transition: all 0.15s;
    }
    button:hover {
      background: #e94560;
      color: #1a1a2e;
    }
    select {
      background: #16213e;
      border: 1px solid #e94560;
      color: #e94560;
      padding: 6px 14px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      border-radius: 2px;
    }
    select option { background: #16213e; color: #eee; }
    #tooltip {
      position: fixed;
      background: rgba(0,0,0,0.85);
      border: 1px solid #e94560;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 11px;
      pointer-events: none;
      display: none;
      z-index: 100;
      max-width: 200px;
    }
    #tooltip .name { color: #e94560; font-weight: bold; }
    #tooltip .state { color: #aaa; }
    #tooltip .task { color: #66aaff; }
    .status-bar {
      display: flex;
      gap: 16px;
      font-size: 11px;
      color: #555;
    }
    .status-bar .agent {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
    }
    .status-dot.working { background: #4ade80; }
    .status-dot.idle { background: #fbbf24; }
    .status-dot.sleeping { background: #818cf8; }
    .status-dot.thinking { background: #f472b6; }
    .status-dot.error { background: #ef4444; }
    .status-dot.speaking { background: #22d3ee; }
  </style>
</head>
<body>
  <h1>Miniverse</h1>
  <p class="subtitle">a tiny pixel world for your AI agents</p>
  <div id="miniverse-container"></div>
  <div class="controls">
    <select id="world-select"></select>
    <button id="intercom-btn">Intercom</button>
    <button id="cycle-morty">Cycle Morty</button>
    <button id="cycle-dexter">Cycle Dexter</button>
  </div>
  <div class="status-bar" id="status-bar"></div>
  <div id="tooltip">
    <div class="name"></div>
    <div class="state"></div>
    <div class="task"></div>
  </div>
  
  <div id="debug-output" style="color:#0f0;padding:10px;background:#001a00;border:2px solid #0f0;margin:10px;font-size:10px;max-width:800px;max-height:300px;overflow:auto;">Debug output...</div>
  
  <!-- Wrap the Miniverse script in try-catch -->
  <script>
    window._miniverseLog = [];
    window._log = function(msg) {
      window._miniverseLog.push(msg);
      console.log(msg);
      var d = document.getElementById('debug-output');
      if (d) d.innerHTML += '<br>' + msg;
    };
    
    // Override console methods before loading script
    var origLog = console.log;
    console.log = function() {
      var args = Array.prototype.slice.call(arguments);
      origLog.apply(console, args);
      var d = document.getElementById('debug-output');
      if (d) d.innerHTML += '<br>[LOG] ' + args.join(' ').substring(0, 100);
    };
    
    var origError = console.error;
    console.error = function() {
      var args = Array.prototype.slice.call(arguments);
      origError.apply(console, args);
      var d = document.getElementById('debug-output');
      if (d) d.innerHTML += '<br><span style="color:#f44">[ERR] ' + args.join(' ').substring(0, 200) + '</span>';
    };
    
    window._log('Preparing to load script...');
  </script>
  
  <script src="./assets/index--9ugS9WN.js" onerror="window._log('SCRIPT LOAD ERROR')" onload="window._log('Script tag loaded')"></script>
  
  <script>
    window._log('After script tag');
    
    // Check execution after delays
    setTimeout(function() {
      window._log('=== 2s CHECK ===');
      window._log('Canvas: ' + (document.querySelector('canvas') ? 'YES' : 'NO'));
      window._log('Container kids: ' + document.getElementById('miniverse-container').children.length);
      window._log('Logs captured: ' + window._miniverseLog.length);
    }, 2000);
    
    setTimeout(function() {
      window._log('=== 5s CHECK ===');
      var canvas = document.querySelector('canvas');
      if (!canvas) {
        window._log('<span style="color:#f44">FAILED: No canvas after 5s</span>');
        // Show all captured logs
        var d = document.getElementById('debug-output');
        if (d) {
          d.innerHTML += '<br><br><b>All logs:</b><br>' + window._miniverseLog.join('<br>');
        }
      }
    }, 5000);
  </script>
</body>
</html>
