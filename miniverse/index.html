<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miniverse Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    h1 {
      font-size: 20px;
      color: #e94560;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    #miniverse-container {
      border: 2px solid #333;
      border-radius: 4px;
      overflow: hidden;
      background: #0f0f23;
      display: inline-block;
      line-height: 0;
      transition: border-color 0.15s, border-radius 0.15s;
    }
    #editor-wrapper #miniverse-container {
      border-color: #00ff88;
      border-radius: 4px 0 0 4px;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #16213e;
      border: 1px solid #e94560;
      color: #e94560;
      padding: 6px 14px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      border-radius: 2px;
      transition: all 0.15s;
    }
    button:hover {
      background: #e94560;
      color: #1a1a2e;
    }
    select {
      background: #16213e;
      border: 1px solid #e94560;
      color: #e94560;
      padding: 6px 14px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      border-radius: 2px;
    }
    select option { background: #16213e; color: #eee; }
    #tooltip {
      position: fixed;
      background: rgba(0,0,0,0.85);
      border: 1px solid #e94560;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 11px;
      pointer-events: none;
      display: none;
      z-index: 100;
      max-width: 200px;
    }
    #tooltip .name { color: #e94560; font-weight: bold; }
    #tooltip .state { color: #aaa; }
    #tooltip .task { color: #66aaff; }
    .status-bar {
      display: flex;
      gap: 16px;
      font-size: 11px;
      color: #555;
    }
    .status-bar .agent {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
    }
    .status-dot.working { background: #4ade80; }
    .status-dot.idle { background: #fbbf24; }
    .status-dot.sleeping { background: #818cf8; }
    .status-dot.thinking { background: #f472b6; }
    .status-dot.error { background: #ef4444; }
    .status-dot.speaking { background: #22d3ee; }
  </style>
  <script type="module" crossorigin src="./assets/index--9ugS9WN.js"></script>
  <script>
    // Debug logging
    console.log('HTML loaded, waiting for module...');
    
    // Check module execution
    setTimeout(function() {
      console.log('Checking module execution...');
      console.log('mt function exists:', typeof window.mt === 'function');
      console.log('Miniverse class exists:', typeof window.Miniverse !== 'undefined');
      
      var canvas = document.querySelector('canvas');
      var container = document.getElementById('miniverse-container');
      
      if (!canvas) {
        console.error('No canvas found!');
        var div = document.createElement('div');
        div.style.cssText = 'color:red;padding:20px;background:#1a0000;border:2px solid red;margin:20px;max-width:800px;font-size:12px;';
        div.innerHTML = '<b>Error:</b> Canvas not created.<br>Container children: ' + (container ? container.children.length : 'N/A') + '<br>mt exists: ' + (typeof window.mt === 'function');
        document.body.appendChild(div);
      } else {
        console.log('Canvas found!');
      }
    }, 5000);
    
    // Capture all errors
    window.addEventListener('error', function(e) {
      console.error('Error:', e.message, 'at', e.filename, ':', e.lineno);
      var div = document.createElement('div');
      div.style.cssText = 'color:red;padding:20px;background:#1a0000;border:2px solid red;margin:20px;max-width:800px;font-size:12px;';
      div.innerHTML = '<b>JavaScript Error:</b><br>' + e.message + '<br>at ' + e.filename + ':' + e.lineno;
      document.body.appendChild(div);
    });
    
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Promise rejection:', e.reason);
      var div = document.createElement('div');
      div.style.cssText = 'color:orange;padding:20px;background:#2a1a00;border:2px solid orange;margin:20px;max-width:800px;font-size:12px;';
      div.innerHTML = '<b>Promise Error:</b><br>' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
      document.body.appendChild(div);
    });
  </script>
</head>
<body>
  <h1>Miniverse</h1>
  <p class="subtitle">a tiny pixel world for your AI agents</p>
  <div id="miniverse-container"></div>
  <div class="controls">
    <select id="world-select"></select>
    <button onclick="triggerIntercom()">Intercom</button>
    <button onclick="cycleState('morty')">Cycle Morty</button>
    <button onclick="cycleState('dexter')">Cycle Dexter</button>
  </div>
  <div class="status-bar" id="status-bar"></div>
  <div id="tooltip">
    <div class="name"></div>
    <div class="state"></div>
    <div class="task"></div>
  </div>
</body>
</html>
