<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sky Jumper - Endless Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        
        body {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #FFF8DC 100%);
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #highScore {
            position: absolute;
            top: 50px;
            left: 20px;
            font-size: 16px;
            color: #FFD700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        #powerUpIndicator {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #FF6B6B;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
        
        #gameOverScreen {
            display: none;
        }
        
        h1 {
            font-size: 48px;
            color: #FFD700;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .subtitle {
            font-size: 18px;
            color: #fff;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        #finalScore {
            font-size: 36px;
            color: #fff;
            margin-bottom: 20px;
        }
        
        .instructions {
            margin-top: 30px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        .control-key {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 8px;
            color: #fff;
        }

        #jumpHint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            font-size: 20px;
            animation: bounce 1s infinite;
            display: none;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="highScore">High Score: 0</div>
            <div id="powerUpIndicator">🔥 DOUBLE JUMP!</div>
            <div id="jumpHint">Tap or Space to Jump!</div>
        </div>
        <div id="startScreen">
            <h1>☁️ Sky Jumper</h1>
            <p class="subtitle">Jump higher, collect stars, avoid enemies!</p>
            <button class="btn" onclick="startGame()">PLAY NOW</button>
            <div class="instructions">
                <div class="controls">
                    <span class="control-key">SPACE</span>
                    <span class="control-key">TAP</span>
                </div>
                <p>to jump • collect coins • avoid red enemies</p>
            </div>
        </div>
        <div id="gameOverScreen">
            <h1>💥 Game Over!</h1>
            <div id="finalScore">Score: 0</div>
            <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game settings
        const GAME_WIDTH = 400;
        const GAME_HEIGHT = 600;
        const GRAVITY = 0.5;
        const JUMP_FORCE = -12;
        const MOVE_SPEED = 5;
        const PLATFORM_WIDTH = 80;
        const PLATFORM_HEIGHT = 15;
        
        // Set canvas size
        function resizeCanvas() {
            const maxWidth = Math.min(window.innerWidth - 20, 400);
            const maxHeight = Math.min(window.innerHeight - 20, 600);
            const scale = Math.min(maxWidth / GAME_WIDTH, maxHeight / GAME_HEIGHT);
            
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
            canvas.style.width = (GAME_WIDTH * scale) + 'px';
            canvas.style.height = (GAME_HEIGHT * scale) + 'px';
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Game state
        let gameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('skyJumperHighScore') || 0;
        let camera = { y: 0 };
        let particles = [];
        let clouds = [];
        
        // Player
        const player = {
            x: GAME_WIDTH / 2,
            y: GAME_HEIGHT - 150,
            width: 30,
            height: 30,
            vx: 0,
            vy: 0,
            onGround: false,
            doubleJump: false,
            doubleJumpActive: false,
            color: '#FF6B6B',
            trail: []
        };
        
        // Platforms
        let platforms = [];
        
        // Collectibles
        let coins = [];
        let powerUps = [];
        
        // Enemies
        let enemies = [];
        
        // Initialize clouds
        function initClouds() {
            clouds = [];
            for (let i = 0; i < 8; i++) {
                clouds.push({
                    x: Math.random() * GAME_WIDTH,
                    y: Math.random() * GAME_HEIGHT,
                    width: 60 + Math.random() * 40,
                    speed: 0.2 + Math.random() * 0.3
                });
            }
        }
        
        // Initialize platforms
        function initPlatforms() {
            platforms = [];
            // Starting platform
            platforms.push({
                x: GAME_WIDTH / 2 - PLATFORM_WIDTH / 2,
                y: GAME_HEIGHT - 50,
                width: PLATFORM_WIDTH,
                height: PLATFORM_HEIGHT,
                type: 'normal',
                color: '#4ECDC4'
            });
            
            // Generate initial platforms
            for (let i = 1; i < 10; i++) {
                generatePlatform(GAME_HEIGHT - 50 - i * 80);
            }
        }
        
        // Generate a platform
        function generatePlatform(y) {
            const types = ['normal', 'moving', 'breakable'];
            const type = Math.random() < 0.7 ? 'normal' : (Math.random() < 0.5 ? 'moving' : 'breakable');
            
            const platform = {
                x: Math.random() * (GAME_WIDTH - PLATFORM_WIDTH),
                y: y,
                width: PLATFORM_WIDTH,
                height: PLATFORM_HEIGHT,
                type: type,
                color: type === 'normal' ? '#4ECDC4' : (type === 'moving' ? '#FFE66D' : '#FF6B6B'),
                vx: type === 'moving' ? (Math.random() < 0.5 ? 2 : -2) : 0
            };
            
            platforms.push(platform);
            
            // Chance to spawn coin
            if (Math.random() < 0.4) {
                coins.push({
                    x: platform.x + platform.width / 2 - 10,
                    y: platform.y - 30,
                    width: 20,
                    height: 20,
                    collected: false,
                    float: 0
                });
            }
            
            // Chance to spawn power-up
            if (Math.random() < 0.08 && score > 500) {
                powerUps.push({
                    x: platform.x + platform.width / 2 - 12,
                    y: platform.y - 35,
                    width: 24,
                    height: 24,
                    type: 'doubleJump',
                    collected: false,
                    pulse: 0
                });
            }
            
            // Chance to spawn enemy
            if (Math.random() < 0.15 && score > 300) {
                enemies.push({
                    x: platform.x + platform.width / 2 - 15,
                    y: platform.y - 25,
                    width: 30,
                    height: 25,
                    vx: 1,
                    platform: platform
                });
            }
        }
        
        // Create particles
        function createParticles(x, y, color, count = 5) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: color,
                    size: Math.random() * 5 + 3
                });
            }
        }
        
        // Update particles
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life -= 0.02;
                return p.life > 0;
            });
        }
        
        // Draw particles
        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y - camera.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }
        
        // Update clouds
        function updateClouds() {
            clouds.forEach(cloud => {
                cloud.x += cloud.speed;
                if (cloud.x > GAME_WIDTH + cloud.width) {
                    cloud.x = -cloud.width;
                    cloud.y = camera.y + Math.random() * GAME_HEIGHT;
                }
            });
        }
        
        // Draw clouds
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            clouds.forEach(cloud => {
                const y = cloud.y - camera.y * 0.3;
                if (y > -100 && y < GAME_HEIGHT + 100) {
                    ctx.beginPath();
                    ctx.arc(cloud.x, y, cloud.width / 2, 0, Math.PI * 2);
                    ctx.arc(cloud.x + cloud.width * 0.3, y - 10, cloud.width * 0.4, 0, Math.PI * 2);
                    ctx.arc(cloud.x - cloud.width * 0.3, y - 5, cloud.width * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        // Update player
        function updatePlayer() {
            // Apply gravity
            player.vy += GRAVITY;
            
            // Update position
            player.x += player.vx;
            player.y += player.vy;
            
            // Screen wrap
            if (player.x < 0) player.x = GAME_WIDTH;
            if (player.x > GAME_WIDTH) player.x = 0;
            
            // Trail effect
            if (gameRunning && Math.abs(player.vy) > 2) {
                player.trail.push({ x: player.x, y: player.y, life: 0.5 });
            }
            player.trail = player.trail.filter(t => {
                t.life -= 0.05;
                return t.life > 0;
            });
            
            // Platform collision
            player.onGround = false;
            platforms.forEach(platform => {
                if (player.vy > 0 &&
                    player.x + player.width / 2 > platform.x &&
                    player.x - player.width / 2 < platform.x + platform.width &&
                    player.y + player.height / 2 > platform.y &&
                    player.y + player.height / 2 < platform.y + platform.height + player.vy + 5) {
                    
                    player.y = platform.y - player.height / 2;
                    player.vy = JUMP_FORCE;
                    player.onGround = true;
                    player.doubleJump = player.doubleJumpActive;
                    
                    // Breakable platform
                    if (platform.type === 'breakable') {
                        createParticles(platform.x + platform.width / 2, platform.y, '#FF6B6B', 8);
                        platform.broken = true;
                    } else {
                        createParticles(player.x, player.y + player.height / 2, '#4ECDC4', 3);
                    }
                }
            });
            
            // Remove broken platforms
            platforms = platforms.filter(p => !p.broken);
            
            // Coin collection
            coins = coins.filter(coin => {
                if (!coin.collected &&
                    player.x + player.width / 2 > coin.x &&
                    player.x - player.width / 2 < coin.x + coin.width &&
                    player.y + player.height / 2 > coin.y &&
                    player.y - player.height / 2 < coin.y + coin.height) {
                    
                    coin.collected = true;
                    score += 50;
                    createParticles(coin.x + 10, coin.y + 10, '#FFD700', 6);
                    return false;
                }
                return true;
            });
            
            // Power-up collection
            powerUps = powerUps.filter(pu => {
                if (!pu.collected &&
                    player.x + player.width / 2 > pu.x &&
                    player.x - player.width / 2 < pu.x + pu.width &&
                    player.y + player.height / 2 > pu.y &&
                    player.y - player.height / 2 < pu.y + pu.height) {
                    
                    pu.collected = true;
                    activatePowerUp(pu.type);
                    createParticles(pu.x + 12, pu.y + 12, '#FF6B6B', 8);
                    return false;
                }
                return true;
            });
            
            // Enemy collision
            enemies.forEach(enemy => {
                if (player.x + player.width / 2 > enemy.x &&
                    player.x - player.width / 2 < enemy.x + enemy.width &&
                    player.y + player.height / 2 > enemy.y &&
                    player.y - player.height / 2 < enemy.y + enemy.height) {
                    
                    // Check if jumping on enemy
                    if (player.vy > 0 && player.y < enemy.y) {
                        player.vy = JUMP_FORCE * 0.8;
                        score += 100;
                        createParticles(enemy.x + 15, enemy.y, '#FF4444', 10);
                        enemy.dead = true;
                    } else {
                        gameOver();
                    }
                }
            });
            enemies = enemies.filter(e => !e.dead);
            
            // Update camera
            if (player.y < camera.y + GAME_HEIGHT / 2) {
                const diff = (camera.y + GAME_HEIGHT / 2) - player.y;
                camera.y -= diff * 0.1;
                score += Math.floor(diff * 0.1);
            }
            
            // Generate new platforms
            const highestPlatform = Math.min(...platforms.map(p => p.y));
            if (highestPlatform > camera.y - 200) {
                generatePlatform(highestPlatform - 80 - Math.random() * 20);
            }
            
            // Remove off-screen platforms and entities
            platforms = platforms.filter(p => p.y < camera.y + GAME_HEIGHT + 100);
            coins = coins.filter(c => c.y < camera.y + GAME_HEIGHT + 100);
            powerUps = coins.filter(p => p.y < camera.y + GAME_HEIGHT + 100);
            enemies = enemies.filter(e => e.y < camera.y + GAME_HEIGHT + 100);
            
            // Game over if fall
            if (player.y > camera.y + GAME_HEIGHT + 100) {
                gameOver();
            }
        }
        
        // Activate power-up
        function activatePowerUp(type) {
            if (type === 'doubleJump') {
                player.doubleJumpActive = true;
                player.doubleJump = true;
                document.getElementById('powerUpIndicator').style.opacity = 1;
                setTimeout(() => {
                    player.doubleJumpActive = false;
                    document.getElementById('powerUpIndicator').style.opacity = 0;
                }, 10000);
            }
        }
        
        // Update platforms
        function updatePlatforms() {
            platforms.forEach(platform => {
                if (platform.type === 'moving') {
                    platform.x += platform.vx;
                    if (platform.x <= 0 || platform.x + platform.width >= GAME_WIDTH) {
                        platform.vx *= -1;
                    }
                }
            });
            
            // Update enemies
            enemies.forEach(enemy => {
                enemy.x += enemy.vx;
                if (enemy.x <= enemy.platform.x || enemy.x + enemy.width >= enemy.platform.x + enemy.platform.width) {
                    enemy.vx *= -1;
                }
            });
        }
        
        // Draw player
        function drawPlayer() {
            // Draw trail
            player.trail.forEach((t, i) => {
                ctx.globalAlpha = t.life * 0.3;
                ctx.fillStyle = player.color;
                ctx.fillRect(t.x - player.width / 2, t.y - player.height / 2 - camera.y, player.width, player.height);
            });
            ctx.globalAlpha = 1;
            
            // Draw player body
            const y = player.y - camera.y;
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(player.x, y + player.height / 2 + 5, player.width / 2, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Body
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x - player.width / 2, y - player.height / 2, player.width, player.height);
            
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x - 8, y - 8, 6, 6);
            ctx.fillRect(player.x + 2, y - 8, 6, 6);
            
            // Pupils
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x - 6, y - 6, 3, 3);
            ctx.fillRect(player.x + 4, y - 6, 3, 3);
            
            // Smile
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(player.x, y + 2, 5, 0, Math.PI);
            ctx.stroke();
            
            // Double jump indicator
            if (player.doubleJumpActive) {
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 3;
                ctx.strokeRect(player.x - player.width / 2 - 3, y - player.height / 2 - 3, player.width + 6, player.height + 6);
            }
        }
        
        // Draw platforms
        function drawPlatforms() {
            platforms.forEach(platform => {
                const y = platform.y - camera.y;
                if (y > -50 && y < GAME_HEIGHT + 50) {
                    // Platform shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.fillRect(platform.x + 3, y + 3, platform.width, platform.height);
                    
                    // Platform body
                    ctx.fillStyle = platform.color;
                    ctx.fillRect(platform.x, y, platform.width, platform.height);
                    
                    // Platform highlight
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fillRect(platform.x, y, platform.width, 4);
                    
                    // Moving platform indicator
                    if (platform.type === 'moving') {
                        ctx.fillStyle = '#FF6B6B';
                        ctx.fillRect(platform.x + 5, y + 5, 5, 5);
                        ctx.fillRect(platform.x + platform.width - 10, y + 5, 5, 5);
                    }
                }
            });
        }
        
        // Draw coins
        function drawCoins() {
            coins.forEach(coin => {
                const y = coin.y - camera.y + Math.sin(Date.now() / 200 + coin.x) * 3;
                if (y > -50 && y < GAME_HEIGHT + 50) {
                    // Glow
                    ctx.shadowColor = '#FFD700';
                    ctx.shadowBlur = 15;
                    
                    // Coin body
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(coin.x + 10, y + 10, 10, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Inner shine
                    ctx.fillStyle = '#FFED4A';
                    ctx.beginPath();
                    ctx.arc(coin.x + 10, y + 10, 6, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.shadowBlur = 0;
                }
            });
        }
        
        // Draw power-ups
        function drawPowerUps() {
            powerUps.forEach(pu => {
                const y = pu.y - camera.y;
                if (y > -50 && y < GAME_HEIGHT + 50) {
                    pu.pulse += 0.1;
                    const scale = 1 + Math.sin(pu.pulse) * 0.1;
                    
                    ctx.save();
                    ctx.translate(pu.x + pu.width / 2, y + pu.height / 2);
                    ctx.scale(scale, scale);
                    
                    // Glow
                    ctx.shadowColor = '#FF6B6B';
                    ctx.shadowBlur = 20;
                    
                    // Power-up body
                    ctx.fillStyle = '#FF6B6B';
                    ctx.fillRect(-12, -12, 24, 24);
                    
                    // Icon
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('⚡', 0, 5);
                    
                    ctx.restore();
                    ctx.shadowBlur = 0;
                }
            });
        }
        
        // Draw enemies
        function drawEnemies() {
            enemies.forEach(enemy => {
                const y = enemy.y - camera.y;
                if (y > -50 && y < GAME_HEIGHT + 50) {
                    // Enemy body
                    ctx.fillStyle = '#E74C3C';
                    ctx.fillRect(enemy.x, y, enemy.width, enemy.height);
                    
                    // Spikes
                    ctx.fillStyle = '#C0392B';
                    ctx.beginPath();
                    ctx.moveTo(enemy.x, y);
                    ctx.lineTo(enemy.x + 5, y - 8);
                    ctx.lineTo(enemy.x + 10, y);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.moveTo(enemy.x + enemy.width - 10, y);
                    ctx.lineTo(enemy.x + enemy.width - 5, y - 8);
                    ctx.lineTo(enemy.x + enemy.width, y);
                    ctx.fill();
                    
                    // Angry eyes
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(enemy.x + 5, y + 5, 6, 6);
                    ctx.fillRect(enemy.x + enemy.width - 11, y + 5, 6, 6);
                    
                    ctx.fillStyle = '#000';
                    ctx.fillRect(enemy.x + 7, y + 7, 3, 3);
                    ctx.fillRect(enemy.x + enemy.width - 9, y + 7, 3, 3);
                    
                    // Eyebrows (angry)
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(enemy.x + 4, y + 4);
                    ctx.lineTo(enemy.x + 10, y + 7);
                    ctx.moveTo(enemy.x + enemy.width - 4, y + 4);
                    ctx.lineTo(enemy.x + enemy.width - 10, y + 7);
                    ctx.stroke();
                }
            });
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            // Clear canvas
            ctx.fillStyle = 'rgba(135, 206, 235, 0.3)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // Update
            updateClouds();
            updatePlayer();
            updatePlatforms();
            updateParticles();
            
            // Draw
            drawClouds();
            drawPlatforms();
            drawCoins();
            drawPowerUps();
            drawEnemies();
            drawPlayer();
            drawParticles();
            
            // Update UI
            document.getElementById('score').textContent = `Score: ${score}`;
            document.getElementById('highScore').textContent = `High Score: ${highScore}`;
            
            requestAnimationFrame(gameLoop);
        }
        
        // Jump function
        function jump() {
            if (!gameRunning) return;
            
            if (player.onGround) {
                player.vy = JUMP_FORCE;
                player.onGround = false;
                createParticles(player.x, player.y + player.height / 2, '#4ECDC4', 4);
            } else if (player.doubleJump) {
                player.vy = JUMP_FORCE * 0.9;
                player.doubleJump = false;
                createParticles(player.x, player.y + player.height / 2, '#FFD700', 6);
            }
        }
        
        // Start game
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('jumpHint').style.display = 'block';
            setTimeout(() => {
                document.getElementById('jumpHint').style.display = 'none';
            }, 3000);
            
            gameRunning = true;
            score = 0;
            camera.y = 0;
            
            // Reset player
            player.x = GAME_WIDTH / 2;
            player.y = GAME_HEIGHT - 150;
            player.vx = 0;
            player.vy = 0;
            player.doubleJumpActive = false;
            player.doubleJump = false;
            player.trail = [];
            
            initClouds();
            initPlatforms();
            coins = [];
            powerUps = [];
            enemies = [];
            particles = [];
            
            gameLoop();
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('skyJumperHighScore', highScore);
            }
            
            document.getElementById('finalScore').textContent = `Score: ${score}`;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }
        
        // Restart game
        function restartGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            startGame();
        }
        
        // Input handling
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
            if (e.code === 'ArrowLeft') {
                player.vx = -MOVE_SPEED;
            }
            if (e.code === 'ArrowRight') {
                player.vx = MOVE_SPEED;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
                player.vx = 0;
            }
        });
        
        // Touch controls
        let touchStartX = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
            touchStartX = e.touches[0].clientX;
        }, { passive: false });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touchX = e.touches[0].clientX;
            const diff = touchX - touchStartX;
            
            if (Math.abs(diff) > 10) {
                player.vx = diff > 0 ? MOVE_SPEED : -MOVE_SPEED;
            }
        }, { passive: false });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            player.vx = 0;
        }, { passive: false });
        
        // Mouse click to jump
        canvas.addEventListener('mousedown', (e) => {
            jump();
        });
        
        // Initialize
        document.getElementById('highScore').textContent = `High Score: ${highScore}`;
    </script>
</body>
</html>
