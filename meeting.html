<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Team Meeting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0D0D0D 0%, #1a1a2e 50%, #0D0D0D 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        
        .scene {
            width: 900px;
            height: 600px;
            position: relative;
        }
        
        .title {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .title h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .title p {
            color: #A0A0A0;
            font-size: 1rem;
        }
        
        .meeting-table {
            background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
            border-radius: 20px;
            padding: 40px;
            position: relative;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            min-height: 400px;
        }
        
        .character {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: fadeInUp 0.6s ease-out;
        }
        
        .character:nth-child(2) { animation-delay: 0.1s; }
        .character:nth-child(3) { animation-delay: 0.2s; }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .speech-bubble {
            background: #fff;
            padding: 12px 18px;
            border-radius: 15px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-size: 13px;
            color: #333;
            font-weight: 600;
            white-space: nowrap;
            animation: popIn 0.4s ease-out 0.5s both;
        }
        
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid #fff;
        }
        
        .groot .speech-bubble { border: 2px solid #4A7C23; }
        .fin .speech-bubble { border: 2px solid #3B82F6; }
        .betty .speech-bubble { border: 2px solid #FF6B9D; }
        
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }
        
        .groot .avatar {
            background: linear-gradient(135deg, #2D5016, #4A7C23);
            border: 4px solid #4A7C23;
        }
        
        .fin .avatar {
            background: linear-gradient(135deg, #1E3A5F, #3B82F6);
            border: 4px solid #3B82F6;
        }
        
        .betty .avatar {
            background: linear-gradient(135deg, #FFE66D, #FF6B9D);
            border: 4px solid #FF6B9D;
        }
        
        .status-ring {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid #1a1a2e;
        }
        
        .groot .status-ring {
            background: #22C55E;
            box-shadow: 0 0 10px #22C55E;
        }
        
        .fin .status-ring, .betty .status-ring {
            background: #EAB308;
            box-shadow: 0 0 10px #EAB308;
        }
        
        .name {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .groot .name { color: #4A7C23; }
        .fin .name { color: #3B82F6; }
        .betty .name { color: #FF6B9D; }
        
        .role {
            color: #A0A0A0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        
        .laptop {
            width: 120px;
            height: 80px;
            background: linear-gradient(135deg, #333, #222);
            border-radius: 8px 8px 0 0;
            position: relative;
            margin-bottom: -40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .laptop-screen {
            width: 110px;
            height: 70px;
            background: #000;
            border-radius: 4px;
            margin: 5px auto;
            overflow: hidden;
            position: relative;
        }
        
        .screen-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #fff;
            text-align: center;
            line-height: 1.4;
        }
        
        .groot .screen-content {
            background: linear-gradient(45deg, #2D5016, #4A7C23);
        }
        
        .fin .screen-content {
            background: linear-gradient(45deg, #1E3A5F, #3B82F6);
        }
        
        .betty .screen-content {
            background: linear-gradient(45deg, #FFE66D, #FF6B9D);
            color: #333;
        }
        
        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .connection-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .floating-emoji {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        
        .emoji-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .emoji-2 { top: 20%; right: 15%; animation-delay: 1s; }
        .emoji-3 { bottom: 30%; left: 5%; animation-delay: 2s; }
        .emoji-4 { bottom: 20%; right: 10%; animation-delay: 3s; }
    </style>
</head>
<body>
    <div class="scene">
        <div class="title">
            <h1>🤖 OpenClaw Team Meeting</h1>
            <p>Discussing today's tasks and priorities</p>
        </div>
        
        <div class="meeting-table">
            <div class="glow"></div>
            
            <!-- Groot -->
            <div class="character groot">
                <div class="speech-bubble">💬 "Fin, check TSLA"</div>
                <div class="avatar">
                    🌳
                    <div class="status-ring"></div>
                </div>
                <div class="name">Groot</div>
                <div class="role">Program Director</div>
                
                <div class="laptop">
                    <div class="laptop-screen">
                        <div class="screen-content">
                            📋 TASKS
                            <br>DASHBOARD
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Fin -->
            <div class="character fin">
                <div class="speech-bubble">💬 "TSLA down 3%"</div>
                <div class="avatar">
                    📊
                    <div class="status-ring"></div>
                </div>
                <div class="name">Fin</div>
                <div class="role">Financial Analyst</div>
                
                <div class="laptop">
                    <div class="laptop-screen">
                        <div class="screen-content">
                            📈 YAHOO
                            <br>FINANCE
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Betty -->
            <div class="character betty">
                <div class="speech-bubble">💬 "New game ready!"🎮</div>
                <div class="avatar">
                    🎈
                    <div class="status-ring"></div>
                </div>
                <div class="name">Betty</div>
                <div class="role">Game Developer</div>
                
                <div class="laptop">
                    <div class="laptop-screen">
                        <div class="screen-content">
                            🎮 HTML5
                            <br>GAME
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Floating emojis -->
        <div class="floating-emoji emoji-1">💡</div>
        <div class="floating-emoji emoji-2">⚡</div>
        <div class="floating-emoji emoji-3">🎯</div>
        <div class="floating-emoji emoji-4">🚀</div>
    </div>
</body>
</html>
